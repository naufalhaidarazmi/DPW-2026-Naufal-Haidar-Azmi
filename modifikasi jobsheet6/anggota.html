<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Anggota — SIMPUS-Mini v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📚 SIMPUS-Mini</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="buku.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="anggota.html">Daftar Anggota</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Manajemen Data Anggota</h2>
                <p class="text-muted m-0">Kelola direktori keanggotaan perpustakaan</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('formAnggota').reset(); document.getElementById('anggotaId').value=''; document.getElementById('anggotaNo').value='ANG-'+Date.now().toString().slice(-6); document.getElementById('anggotaModalLabel').innerText='Tambah Anggota Baru';" data-bs-toggle="modal" data-bs-target="#anggotaModal">+ Tambah Anggota Baru</button>
        </div>

        <div class="card card-stat bg-white p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">👥 Direktori Anggota</h5>
                <input type="text" class="form-control w-25" placeholder="Cari nama/no. anggota..." onkeyup="renderAnggotaTable(this.value)">
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th>No. Anggota</th>
                            <th>Nama Lengkap</th>
                            <th>Alamat</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyAnggota"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form Anggota -->
    <div class="modal fade" id="anggotaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formAnggota" onsubmit="saveAnggotaForm(event)">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="anggotaModalLabel">Tambah Anggota Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="anggotaId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">No. Anggota *</label>
                            <input type="text" class="form-control" id="anggotaNo" required readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Lengkap *</label>
                            <input type="text" class="form-control" id="anggotaNama" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Alamat</label>
                            <textarea class="form-control" id="anggotaAlamat" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">No. HP / WA</label>
                            <input type="text" class="form-control" id="anggotaHp">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script>renderAnggotaTable();</script>
</body>
</html>
