<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Buku — SIMPUS-Mini v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📚 SIMPUS-Mini</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="buku.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="anggota.html">Daftar Anggota</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Manajemen Data Buku</h2>
                <p class="text-muted m-0">Kelola katalog dan stok buku secara real-time</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('formBuku').reset(); document.getElementById('bukuId').value=''; document.getElementById('bukuModalLabel').innerText='Tambah Buku Baru';" data-bs-toggle="modal" data-bs-target="#bukuModal">+ Tambah Buku Baru</button>
        </div>

        <div class="card card-stat bg-white p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">📚 Katalog Buku</h5>
                <input type="text" class="form-control w-25" placeholder="Cari judul/pengarang..." onkeyup="renderBukuTable(this.value)">
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>No</th>
                            <th>Judul Buku</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Kategori</th>
                            <th>Status Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyBuku"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form Buku -->
    <div class="modal fade" id="bukuModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formBuku" onsubmit="saveBukuForm(event)">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="bukuModalLabel">Tambah Buku Baru</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="bukuId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Judul Buku *</label>
                            <input type="text" class="form-control" id="bukuJudul" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pengarang *</label>
                            <input type="text" class="form-control" id="bukuPengarang" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">Tahun *</label>
                                <input type="number" class="form-control" id="bukuTahun" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Stok *</label>
                                <input type="number" class="form-control" id="bukuStok" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kategori</label>
                            <input type="text" class="form-control" id="bukuKategori" value="Umum">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script>renderBukuTable();</script>
</body>
</html>
